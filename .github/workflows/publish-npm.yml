name: Publish npm Package

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read package metadata
        id: pkg
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + pkg.name + '\n'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\n');"

      - name: Debug trusted publish context
        run: |
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "workflow=${{ github.workflow }}"
          echo "workflow_ref=${{ github.workflow_ref }}"
          echo "job_environment=npm-publish"
          echo "package=${{ steps.pkg.outputs.name }}"
          echo "version=${{ steps.pkg.outputs.version }}"

      - name: Check if version already exists on npm
        id: exists
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version not published; proceeding."
          fi

      - name: Publish to npm (Trusted Publisher)
        id: publish_trusted
        continue-on-error: true
        if: steps.exists.outputs.publish == 'true'
        run: npm publish --access public --provenance --registry https://registry.npmjs.org

      - name: Publish to npm (NPM_TOKEN fallback)
        if: steps.exists.outputs.publish == 'true' && steps.publish_trusted.outcome == 'failure' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --registry https://registry.npmjs.org

      - name: Fail with publish diagnostics
        if: steps.exists.outputs.publish == 'true' && steps.publish_trusted.outcome == 'failure' && env.NPM_TOKEN == ''
        run: |
          echo "Trusted Publisher publish failed and NPM_TOKEN fallback is not configured."
          echo "After a GitHub repo rename, re-link npm Trusted Publisher to this exact repo/workflow/environment."
          echo "Or add repository secret NPM_TOKEN to enable automatic fallback publishing."
          exit 1
