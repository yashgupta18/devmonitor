[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devmonitor"
version = "0.1.0"
description = "Python SDK bridge for sending OpenTelemetry-style spans to DevMonitor"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "DevMonitor Contributors" }
]
dependencies = []

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
